<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mark-top" x1="80" y1="24" x2="80" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="mark-mid" x1="80" y1="80" x2="80" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="mark-bot" x1="80" y1="120" x2="80" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Logo mark (compact) -->
  <g transform="translate(20, 12)">
    <!-- Layer 3 bottom -->
    <path d="M30 144L80 176L130 144" stroke="url(#mark-bot)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Layer 2 middle -->
    <path d="M30 116L80 148L130 116" stroke="url(#mark-mid)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Layer 1 top prism -->
    <path d="M80 24L30 72L80 104L130 72Z" fill="url(#mark-top)" fill-opacity="0.12"/>
    <path d="M80 24L30 72L80 104L130 72Z" stroke="url(#mark-top)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Center dot -->
    <circle cx="80" cy="72" r="3" fill="#60a5fa" opacity="0.8"/>
  </g>

  <!-- Wordmark -->
  <text x="190" y="118" font-family="'Inter', 'Geist Sans', -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="0.06em" fill="#0f172a">
    FORESIGHT
  </text>

  <!-- Tagline -->
  <text x="192" y="148" font-family="'Inter', 'Geist Sans', -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#94a3b8">
    DECISION INTELLIGENCE PLATFORM
  </text>
</svg>
