<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0f1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0c0f1a"/>
    </linearGradient>
    <linearGradient id="og-top" x1="200" y1="140" x2="200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="og-mid" x1="200" y1="260" x2="200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="og-bot" x1="200" y1="340" x2="200" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow-bg" cx="300" cy="315" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="og-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#glow-bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Logo mark (large, left side) -->
  <g transform="translate(80, 120)">
    <!-- Bottom layer -->
    <path d="M60 340L200 420L340 340" stroke="url(#og-bot)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Middle layer -->
    <path d="M60 272L200 352L340 272" stroke="url(#og-mid)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Top prism -->
    <path d="M200 20L60 120L200 190L340 120Z" fill="url(#og-top)" fill-opacity="0.1"/>
    <path d="M200 20L60 120L200 190L340 120Z" stroke="url(#og-top)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#og-glow)"/>
    <circle cx="200" cy="120" r="4" fill="#93c5fd" opacity="0.8"/>
  </g>

  <!-- Text content (right side) -->
  <!-- Title -->
  <text x="520" y="260" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="0.04em" fill="#e2e8f0">
    FORESIGHT
  </text>

  <!-- Subtitle -->
  <text x="522" y="310" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="500" fill="#64748b">
    See the outcome before you decide.
  </text>

  <!-- Tags -->
  <g transform="translate(520, 350)">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.25"/>
    <text x="60" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#60a5fa">AI + RAG</text>

    <rect x="136" y="0" width="140" height="32" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.25"/>
    <text x="206" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#60a5fa">350K+ DATA</text>

    <rect x="292" y="0" width="180" height="32" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.25"/>
    <text x="382" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#60a5fa">DETERMINISTIC</text>
  </g>

  <!-- URL -->
  <text x="522" y="440" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.05em" fill="#475569">
    foresight.app
  </text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="629" rx="0" stroke="#1e293b" stroke-width="1" fill="none"/>
</svg>
