[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulator-sdk"
version = "1.0.0"
description = "Python SDK for the Simulator Prediction API -- deterministic scenario analysis powered by 350K+ data points."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[tool.setuptools.packages.find]
include = ["simulator_sdk*"]
