<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid Test</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #fafafa; margin: 0; padding: 24px; }
    h1 { font-size: 20px; font-weight: 700; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .buttons button { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: #e2e8f0; color: #475569; }
    .buttons button.active { background: #3b82f6; color: #fff; }
    .mermaid { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid #e2e8f0; }
    .mermaid svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Mermaid Vertical Test</h1>
  <div class="buttons">
    <button class="active" onclick="show('min')">Summary (7 nodes)</button>
    <button onclick="show('mid')">Analysis (13 nodes)</button>
    <button onclick="show('full')">Full Model (34 nodes)</button>
  </div>

  <div id="diagram" class="mermaid"></div>

  <script>
    const charts = {

  N2{{Gets first interview? 5-15pct}}

  N1 --> N2

      full: `graph TD

  style N1 fill:#d8ead8,stroke:#5f7d63,color:#2d4a32

  style N34 fill:#eff6ff,stroke:#3b82f6,color:#1e40af
  style N35 fill:#d8ead8,stroke:#5f7d63,color:#2d4a32
  style N36 fill:#eff6ff,stroke:#3b82f6,color:#1e40af
  style N37 fill:#d8ead8,stroke:#5f7d63,color:#2d4a32
  style N38 fill:#eff6ff,stroke:#3b82f6,color:#1e40af
  style N39 fill:#d8ead8,stroke:#5f7d63,color:#2d4a32
  style N40 fill:#eff6ff,stroke:#3b82f6,color:#1e40af
  style N41 fill:#fffbeb,stroke:#d97706,color:#92400e
  style N42 fill:#dcfce7,stroke:#6daa84,color:#14532d
  style N43 fill:#fee2e2,stroke:#c87e7e,color:#7f1d1d
  style N50 fill:#dcfce7,stroke:#6daa84,color:#14532d`
    };

    mermaid.initialize({
      startOnLoad: false,
      theme: 'neutral',
      flowchart: { htmlLabels: true, curve: 'basis', nodeSpacing: 50, rankSpacing: 70 }
    });

    async function show(key) {
      document.querySelectorAll('.buttons button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      const el = document.getElementById('diagram');
      el.innerHTML = '';
      el.removeAttribute('data-processed');
      const { svg } = await mermaid.render('mermaid-' + Date.now(), charts[key]);
      el.innerHTML = svg;
    }

    // Initial render
    window.addEventListener('load', () => {
      mermaid.render('mermaid-init', charts.min).then(({ svg }) => {
        document.getElementById('diagram').innerHTML = svg;
      });
    });
  </script>
</body>
</html>
